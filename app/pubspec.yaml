name: app
description: "Mobile Application for Imbeded contest 2026"

publish_to: 'none'

version: 1.0.0+1
environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.4
  auto_size_text: ^3.0.0
  provider: ^6.1.5+1
  flutter_blue_classic:
    path: packages/flutter_blue_classic
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  permission_handler: ^11.3.1
  openai_dart: ^8.0.0
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  assets:
    - asset/img/
    - asset/img_debug/
